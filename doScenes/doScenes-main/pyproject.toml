[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doscenes-formal"
version = "2.0.0"
description = "Formalized doScenes training/evaluation toolkit"
readme = {text = "Formalized doScenes training/evaluation toolkit.", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers==4.41.2",
  "numpy<2",
  "nuscenes-devkit",
  "pandas",
  "pyquaternion",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

